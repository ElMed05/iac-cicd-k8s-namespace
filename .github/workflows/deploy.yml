name: Deploy Kubernetes Namespace via Terraform

on:
  push:
    branches: 
    - main
    - staging
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Zielumgebung (staging oder production)'
        required: true
        default: 'staging'

jobs:
  terraform:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: self-hosted

    environment: ${{ github.event.inputs.environment || 'staging' }}

    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}

    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install required tools (unzip, curl, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl jq

      - name: ⬇️ Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.2
          terraform_wrapper: false

      - name: 📄 Write Kubeconfig from Secret
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > terraform/.kubeconfig
          chmod 600 terraform/.kubeconfig

      - name: 🐞 Debug Kubeconfig (optional)
        run: head -n 20 terraform/.kubeconfig
      
      - name: 🧾 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Terraform Lint mit tflint
        working-directory: terraform
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --init
          tflint

      - name: 📝 Generiere Terraform-Doku mit terraform-docs
        working-directory: terraform
        run: |
          curl -sSLo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.17.0/terraform-docs-v0.17.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz
          chmod +x terraform-docs
          ./terraform-docs markdown table . > TERRAFORM_DOCS.md

      - name: 🐍 Install Python & pip
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip


      - name: 🛡️ Security Check mit Checkov (optional)
        run: |
          pip install checkov
          ~/.local/bin/checkov -d terraform/


      - name: 📂 Generate tfvars file dynamically
        working-directory: terraform
        run: |
          mkdir -p environments
          ENV="${{ github.event.inputs.environment || 'staging' }}"

          if [ "$ENV" = "staging" ]; then
          cat <<EOF > environments/$ENV.tfvars
          namespace   = "team-cong"
          environment = "staging"
          EOF
          elif [ "$ENV" = "production" ]; then
          cat <<EOF > environments/$ENV.tfvars
          namespace   = "team-cong"
          environment = "production"
          EOF
          else
            echo "Unsupported environment: $ENV"
            exit 1
          fi

      - name: 🚀 Terraform Init
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: terraform init

      - name: ✅ Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: ✅ Terraform Validate
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: terraform validate

      - name: 📐 Terraform Plan
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: |
          terraform plan \
            -var-file=environments/${{ github.event.inputs.environment || 'staging' }}.tfvars

      - name: ✅ Terraform Apply (nur auf main)
        if: github.ref == 'refs/heads/main'
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: |
          terraform apply -auto-approve \
            -var-file=environments/${{ github.event.inputs.environment || 'staging' }}.tfvars
