name: Deploy Kubernetes Namespace via Terraform

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Zielumgebung (staging oder production)'
        required: true
        default: 'staging'

jobs:
  setup:
    name: 🔧 Setup
    runs-on: self-hosted
    outputs:
      environment: ${{ steps.setenv.outputs.env }}
    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install required tools (unzip, curl, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl jq python3 python3-pip

      - name: 📂 Write Kubeconfig from Secret
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > terraform/.kubeconfig
          chmod 600 terraform/.kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}

      - name: 🧠 Set Environment
        id: setenv
        run: |
          ENV="${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production') || 'staging' }}"
          echo "env=$ENV" >> $GITHUB_OUTPUT

  lint:
    name: 🔍 TFLint
    needs: setup
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: 📦 Install TFLint
        working-directory: terraform
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --init

      - name: 🚨 Run TFLint
        working-directory: terraform
        run: tflint

  checkov:
    name: 🛡️ Checkov Security Scan
    needs: setup
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: 🛡️ Install & Run Checkov
        working-directory: terraform
        run: |
          pip install --user checkov
          ~/.local/bin/checkov -d .

  validate:
    name: ✅ Terraform Validate
    needs: setup
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Terraform Init
        working-directory: terraform
        run: terraform init
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"

  plan:
    name: 📐 Terraform Plan
    needs: [setup, validate]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: 📂 Generate tfvars File
        working-directory: terraform
        run: |
          mkdir -p environments
          ENV="${{ needs.setup.outputs.environment }}"
          if [ "$ENV" = "staging" ]; then
            cat <<EOF > environments/$ENV.tfvars
            namespace   = "team-cong"
            environment = "staging"
            EOF
          elif [ "$ENV" = "production" ]; then
            cat <<EOF > environments/$ENV.tfvars
            namespace   = "team-cong"
            environment = "production"
            EOF
          else
            echo "Unsupported environment: $ENV"
            exit 1
          fi

      - name: Terraform Init
        working-directory: terraform
        run: terraform init
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -var-file=environments/${{ needs.setup.outputs.environment }}.tfvars
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"

  apply:
    name: 🚀 Terraform Apply
    needs: [setup, plan]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Terraform Init
        working-directory: terraform
        run: terraform init
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -var-file=environments/${{ needs.setup.outputs.environment }}.tfvars
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
