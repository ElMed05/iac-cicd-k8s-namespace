# deploy.yml
name: Deploy Kubernetes Namespace via Terraform

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Zielumgebung (staging oder production)'
        required: true
        default: 'staging'

env:
  TF_VERSION: '1.8.2'
  KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}

jobs:
  setup:
    name: 🧰 Setup Tools & Umgebung
    runs-on: self-hosted
    outputs:
      environment: ${{ steps.setenv.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Tools installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl jq python3 python3-pip

      - name: 📍 Umgebung festlegen
        id: setenv
        run: |
          if [ "${{ github.event.inputs.environment }}" != "" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  checkov:
    name: 🔐 Checkov Scan
    runs-on: self-hosted
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: 🔐 Schreibe Kubeconfig
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > terraform/.kubeconfig
          chmod 600 terraform/.kubeconfig
      - name: Run Checkov
        run: |
          pip install --user checkov
          ~/.local/bin/checkov -d terraform/

  lint:
    name: 🧹 TFLint
    runs-on: self-hosted
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: 🔐 Schreibe Kubeconfig
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > terraform/.kubeconfig
          chmod 600 terraform/.kubeconfig
      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      - name: Run TFLint
        working-directory: terraform
        run: |
          tflint --init
          tflint

  validate:
    name: ✅ Terraform Validate
    runs-on: self-hosted
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: 🔐 Schreibe Kubeconfig
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > terraform/.kubeconfig
          chmod 600 terraform/.kubeconfig
      - name: 🌍 Terraform Init
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: terraform init -upgrade
      - name: ✅ Terraform Validate
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: terraform validate

  plan:
    name: 📐 Terraform Plan
    runs-on: self-hosted
    needs: [setup, validate]
    steps:
      - uses: actions/checkout@v4
      - name: 🔐 Schreibe Kubeconfig
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > terraform/.kubeconfig
          chmod 600 terraform/.kubeconfig
      - name: 📄 tfvars generieren
        run: |
          mkdir -p terraform/environments
          ENV="${{ needs.setup.outputs.environment }}"
          cat <<EOF > terraform/environments/$ENV.tfvars
          namespace   = "team-cong"
          environment = "$ENV"
          EOF
      - name: 🌍 Terraform Init
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: terraform init -upgrade
      - name: 📐 Terraform Plan ausführen
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: terraform plan -var-file=environments/${{ needs.setup.outputs.environment }}.tfvars

  apply:
    name: 🚀 Terraform Apply
    runs-on: self-hosted
    needs: plan
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Schreibe Kubeconfig
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > terraform/.kubeconfig
          chmod 600 terraform/.kubeconfig

      - name: 📄 tfvars generieren
        run: |
          mkdir -p terraform/environments
          cat <<EOF > terraform/environments/production.tfvars
          namespace   = "team-cong"
          environment = "production"
          EOF

      - name: 🌍 Terraform Init
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: terraform init -upgrade

      - name: 🧩 Namespace ggf. importieren
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: |
          terraform state show kubernetes_namespace.this >/dev/null 2>&1 && \
            echo "✅ Namespace bereits im Terraform-State" || \
            (echo "🔁 Namespace wird importiert" && \
              terraform import -var="namespace=team-cong" -var="environment=production" kubernetes_namespace.this team-cong || true)

      - name: 🚀 Terraform Apply ausführen
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: terraform apply -auto-approve -var-file=environments/production.tfvars
      
      - name: 🔍 Smoke Test Namespace vorhanden & Label korrekt
        run: |
          echo "✅ Prüfe, ob Namespace 'team-cong' vorhanden ist und korrekt gelabelt wurde..."
          kubectl get ns team-cong -o json \
            | jq -r '.metadata.labels.environment' \
            | grep -q "production" && \
          echo "✅ Namespace ist korrekt vorhanden und gelabelt." || \
          (echo "❌ Namespace fehlt oder Label ist falsch!" && exit 1)
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
