name: Deploy Kubernetes Namespace via Terraform

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Zielumgebung (staging oder production)'
        required: true
        default: 'staging'

env:
  TF_VERSION: '1.8.2'
  KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}

jobs:
  setup:
    name: 🧰 Setup Tools & Umgebung
    runs-on: self-hosted
    outputs:
      environment: ${{ steps.setenv.outputs.environment }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Tools installieren (curl, unzip, jq, pip)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl jq python3 python3-pip

      - name: 🔐 Schreibe Kubeconfig aus Secret
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > terraform/.kubeconfig
          chmod 600 terraform/.kubeconfig

      - name: 📍 Umgebung festlegen
        id: setenv
        run: |
          if [ "${{ github.event.inputs.environment }}" != "" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  checkov:
    name: 🔐 Security Check mit Checkov
    runs-on: self-hosted
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install --user checkov
          ~/.local/bin/checkov -d terraform/

  lint:
   name: 🧹 TFLint Check
   runs-on: self-hosted
   needs: setup
   steps:
    - uses: actions/checkout@v4
    - name: 📥 TFLint installieren
      run: |
        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
    - name: 🔍 Lint Terraform Code
      working-directory: terraform
      run: |
        tflint --init
        tflint

  validate:
    name: ✅ Terraform Validate
    runs-on: self-hosted
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: 📄 Schreibe tfvars dynamisch
        run: |
          mkdir -p environments
          ENV="staging"
          if [ "$ENV" = "staging" ]; then
          cat <<EOF > environments/$ENV.tfvars
          namespace   = "team-cong"
          environment = "staging"
          EOF
          elif [ "$ENV" = "production" ]; then
          cat <<EOF > environments/$ENV.tfvars
          namespace   = "team-cong"
          environment = "production"
          EOF
          else
            echo "Unsupported environment: $ENV"
            exit 1
          fi


      - name: 🌍 Terraform Init
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: terraform init

      - name: ✅ Terraform Validate
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: terraform validate

  plan:
    name: 📐 Terraform Plan
    runs-on: self-hosted
    needs: [setup, validate]
    steps:
      - uses: actions/checkout@v4
      - name: 📐 Plan ausführen
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: |
          terraform plan \
            -var-file=environments/${{ needs.setup.outputs.environment }}.tfvars

  apply:
    name: 🚀 Terraform Apply
    runs-on: self-hosted
    needs: plan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 🚀 Apply ausführen (nur auf main)
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: |
          terraform apply -auto-approve \
            -var-file=environments/production.tfvars
