name: Deploy Kubernetes Namespace via Terraform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Zielumgebung (staging oder production)'
        required: true
        default: 'staging'

jobs:
  terraform:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: self-hosted  # Dein eigener Runner muss laufen!

    environment: ${{ github.event.inputs.environment || 'staging' }}

    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}

    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install required tools (unzip, curl, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl jq

      - name: ⬇️ Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.2
          terraform_wrapper: false  # ❗️ Verhindert Probleme mit JS-Syntax

      - name: 📄 Write Kubeconfig from Secret
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > terraform/.kubeconfig
          chmod 600 terraform/.kubeconfig

      - name: 🐞 Debug Kubeconfig (optional)
        run: head -n 20 terraform/.kubeconfig

      - name: 🚀 Terraform Init
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: terraform init

      - name: ✅ Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: ✅ Terraform Validate
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: terraform validate

      - name: 📐 Terraform Plan
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: |
          terraform plan \
            -var="namespace=team-cong" \
            -var="environment=${{ github.event.inputs.environment || 'staging' }}"

      - name: ✅ Terraform Apply (nur auf main)
        if: github.ref == 'refs/heads/main'
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
        run: |
          terraform apply -auto-approve \
            -var="namespace=team-cong" \
            -var="environment=${{ github.event.inputs.environment || 'staging' }}"
