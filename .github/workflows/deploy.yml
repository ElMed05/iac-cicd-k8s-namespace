name: Deploy Kubernetes Namespace via Terraform

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Zielumgebung (staging oder production)'
        required: true
        default: 'staging'

env:
  TF_VERSION: 1.8.2

jobs:
  setup:
    name: 🧾 Setup & Shared Environment
    runs-on: self-hosted
    outputs:
      environment: ${{ steps.setenv.outputs.environment }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl jq python3 python3-pip
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          curl -sSLo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.17.0/terraform-docs-v0.17.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz && chmod +x terraform-docs && sudo mv terraform-docs /usr/local/bin/
          pip install --user checkov

      - name: ⬇️ Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: 🔐 Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > terraform/.kubeconfig
          chmod 600 terraform/.kubeconfig

      - name: ⚙️ Set Environment
        id: setenv
        run: |
          if [[ "${{ github.event.inputs.environment }}" != "" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  lint:
    name: 🧹 Terraform Lint (tflint)
    needs: setup
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: tflint --init && tflint
        working-directory: terraform

  docs:
    name: 📝 Terraform Docs
    needs: setup
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: terraform-docs markdown table . > TERRAFORM_DOCS.md
        working-directory: terraform

  security:
    name: 🛡️ Checkov Security Scan
    needs: setup
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: ~/.local/bin/checkov -d terraform/

  validate:
    name: ✅ Terraform Validate
    needs: setup
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: terraform validate
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"

  plan:
    name: 📐 Terraform Plan
    needs: [setup, validate]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: 📁 Generate tfvars
        run: |
          mkdir -p terraform/environments
          echo 'namespace = "team-cong"' > terraform/environments/${{ needs.setup.outputs.environment }}.tfvars
          echo 'environment = "${{ needs.setup.outputs.environment }}"' >> terraform/environments/${{ needs.setup.outputs.environment }}.tfvars
      - name: Terraform Init
        run: terraform init
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"

      - name: Terraform Plan
        run: terraform plan -var-file=environments/${{ needs.setup.outputs.environment }}.tfvars
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"

  apply:
    name: 🚀 Terraform Apply
    needs: [plan]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=environments/production.tfvars
        working-directory: terraform
        env:
          KUBECONFIG: "${{ github.workspace }}/terraform/.kubeconfig"
